<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Frame Editor</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
.container {
    position: relative;
    width: 600px;
    height: 480px; /* 5:4 ratio */
    margin: 20px auto;
    overflow: hidden;
    border: 2px solid #444;
    background: black;
}

/* USER IMAGE */
#userImage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    cursor: grab;
}

/* FRAME (FIXED) */
#frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill; /* KEY FIX */
    z-index: 2;
    pointer-events: none;
    display: block;
}
</style>

</head>
<body>

<h2>Photo Frame Editor</h2>

<input type="file" id="upload" accept="image/*">

<div class="container" id="container">
    <img id="userImage">
    <img id="frame" src="KFCFrame2.png">
</div>

<br>
Zoom: <input type="range" id="zoom" min="0.2" max="3" step="0.01" value="1">

<br><br>
<button onclick="downloadImage()">Download</button>

<canvas id="canvas" width="3000" height="2400" style="display:none;"></canvas>

<script>
const upload = document.getElementById("upload");
const userImage = document.getElementById("userImage");
const frame = document.getElementById("frame");
const zoom = document.getElementById("zoom");

let scale = 1;
let posX = 0, posY = 0;
let dragging = false;
let startX, startY;

// Upload image
upload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        userImage.src = URL.createObjectURL(file);
        userImage.onload = () => {
            userImage.style.width = "100%";
            userImage.style.height = "auto";
        };
    }
});

// Drag
userImage.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
});

// Zoom
zoom.addEventListener("input", () => {
    scale = parseFloat(zoom.value);
    updateTransform();
});

function updateTransform() {
    userImage.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
}

// ✅ WAIT FOR IMAGE LOAD FUNCTION
function waitForImage(img) {
    return new Promise((resolve) => {
        if (img.complete) resolve();
        else img.onload = resolve;
    });
}

// Download
async function downloadImage() {
    if (!userImage.src) {
        alert("Upload image first!");
        return;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const container = document.getElementById("container");

    // wait for both images
    await waitForImage(userImage);
    await waitForImage(frame);

    const scaleX = canvas.width / container.clientWidth;
    const scaleY = canvas.height / container.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const imgW = userImage.clientWidth * scale * scaleX;
    const imgH = userImage.clientHeight * scale * scaleY;

    const imgX = posX * scaleX;
    const imgY = posY * scaleY;

    ctx.drawImage(userImage, imgX, imgY, imgW, imgH);

    // draw frame on top
    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

    // ✅ SAFER DOWNLOAD METHOD
    canvas.toBlob((blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "framed.png";
        link.click();
    }, "image/png");
}
</script>

</body>
</html>
