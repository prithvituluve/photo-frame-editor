<script>
const upload = document.getElementById("upload");
const userImage = document.getElementById("userImage");
const frame = document.getElementById("frame");
const zoom = document.getElementById("zoom");

let scale = 1;
let posX = 0, posY = 0;
let dragging = false;
let startX, startY;
let initialDistance = null;

// Upload image
upload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        userImage.src = URL.createObjectURL(file);
    }
});

// =====================
// 🖱️ DESKTOP DRAG
// =====================
userImage.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
});

// =====================
// 📱 TOUCH DRAG
// =====================
userImage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
        dragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
    }

    // pinch start
    if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
    }
});

userImage.addEventListener("touchmove", (e) => {
    e.preventDefault();

    // drag
    if (e.touches.length === 1 && dragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
    }

    // pinch zoom
    if (e.touches.length === 2) {
        const newDistance = getDistance(e.touches);
        if (initialDistance) {
            let zoomFactor = newDistance / initialDistance;
            scale *= zoomFactor;
            scale = Math.max(0.2, Math.min(scale, 3));
            zoom.value = scale;
            updateTransform();
            initialDistance = newDistance;
        }
    }
}, { passive: false });

document.addEventListener("touchend", () => {
    dragging = false;
    initialDistance = null;
});

// =====================
// 📏 GET DISTANCE (PINCH)
// =====================
function getDistance(touches) {
    let dx = touches[0].clientX - touches[1].clientX;
    let dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

// =====================
// 🎚️ SLIDER ZOOM
// =====================
zoom.addEventListener("input", () => {
    scale = parseFloat(zoom.value);
    updateTransform();
});

// =====================
// 🔄 UPDATE TRANSFORM
// =====================
function updateTransform() {
    userImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;
}

// =====================
// DOWNLOAD (same as yours)
// =====================
function waitForImage(img) {
    return new Promise((resolve) => {
        if (img.complete) resolve();
        else img.onload = resolve;
    });
}

async function downloadImage() {
    if (!userImage.src) {
        alert("Upload image first!");
        return;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("container");

    await waitForImage(userImage);
    await waitForImage(frame);

    const scaleX = canvas.width / container.clientWidth;
    const scaleY = canvas.height / container.clientHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const imgW = userImage.clientWidth * scale * scaleX;
    const imgH = userImage.clientHeight * scale * scaleY;

    const imgX = posX * scaleX;
    const imgY = posY * scaleY;

    ctx.drawImage(userImage, imgX, imgY, imgW, imgH);
    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "framed.png";
        link.click();
    }, "image/png");
}
</script>
