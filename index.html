<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Frame Editor</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
#userImage {
    transform-origin: top left;
}
.container {
    position: relative;
    width: 90%;
    max-width: 600px;
    aspect-ratio: 5/4;
    margin: 20px auto;
    overflow: hidden;
    border: 2px solid #444;
    background: black;
    touch-action: none; /* IMPORTANT */
}

/* USER IMAGE */
#userImage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    cursor: grab;
}

/* FRAME */
#frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 2;
    pointer-events: none;
}

input[type="range"] {
    width: 80%;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Photo Frame Editor</h2>

<input type="file" id="upload" accept="image/*">

<div class="container" id="container">
    <img id="userImage">
    <img id="frame" src="KFCFrame2.png">
</div>

<br>

Zoom:
<input type="range" id="zoom" min="0.2" max="3" step="0.01" value="1">

<br><br>

Horizontal Move:
<input type="range" id="moveX" min="-1000" max="1000" value="0">

<br><br>

Vertical Move:
<input type="range" id="moveY" min="-1000" max="1000" value="0">

<br><br>

<button onclick="downloadImage()">Download</button>

<canvas id="canvas" width="3000" height="2400" style="display:none;"></canvas>

<script>
const upload = document.getElementById("upload");
const userImage = document.getElementById("userImage");
const frame = document.getElementById("frame");
const zoom = document.getElementById("zoom");
const moveX = document.getElementById("moveX");
const moveY = document.getElementById("moveY");

let scale = 1;
let posX = 0, posY = 0;
let dragging = false;
let startX, startY;
let initialDistance = null;

// ================= UPLOAD =================
upload.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        userImage.src = URL.createObjectURL(file);

        // reset position
        posX = 0;
        posY = 0;
        scale = 1;
        zoom.value = 1;
        updateTransform();
    }
});

// ================= DESKTOP DRAG =================
userImage.addEventListener("mousedown", (e) => {
    dragging = true;
    startX = e.clientX - posX;
    startY = e.clientY - posY;
});

document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    posX = e.clientX - startX;
    posY = e.clientY - startY;
    updateTransform();
});

// ================= MOBILE TOUCH =================
userImage.addEventListener("touchstart", (e) => {
    if (e.touches.length === 1) {
        dragging = true;
        startX = e.touches[0].clientX - posX;
        startY = e.touches[0].clientY - posY;
    }

    if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
    }
});

userImage.addEventListener("touchmove", (e) => {
    e.preventDefault();

    if (e.touches.length === 1 && dragging) {
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform();
    }

    if (e.touches.length === 2) {
        const newDistance = getDistance(e.touches);
        if (initialDistance) {
            let zoomFactor = newDistance / initialDistance;
            scale *= zoomFactor;
            scale = Math.max(0.2, Math.min(scale, 3));
            zoom.value = scale;
            updateTransform();
            initialDistance = newDistance;
        }
    }
}, { passive: false });

document.addEventListener("touchend", () => {
    dragging = false;
    initialDistance = null;
});

// ================= DISTANCE =================
function getDistance(touches) {
    let dx = touches[0].clientX - touches[1].clientX;
    let dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
}

// ================= SLIDERS =================
zoom.addEventListener("input", () => {
    scale = parseFloat(zoom.value);
    updateTransform();
});

moveX.addEventListener("input", () => {
    posX = parseInt(moveX.value);
    updateTransform();
});

moveY.addEventListener("input", () => {
    posY = parseInt(moveY.value);
    updateTransform();
});

// ================= TRANSFORM =================
function updateTransform() {
    userImage.style.transform =
        `translate(${posX}px, ${posY}px) scale(${scale})`;

    moveX.value = posX;
    moveY.value = posY;
}

// ================= IMAGE LOAD =================
function waitForImage(img) {
    return new Promise((resolve) => {
        if (img.complete) resolve();
        else img.onload = resolve;
    });
}

// ================= DOWNLOAD (FIXED) =================
async function downloadImage() {
    if (!userImage.src) {
        alert("Upload image first!");
        return;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("container");

    await waitForImage(userImage);
    await waitForImage(frame);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const imgW = userImage.naturalWidth;
    const imgH = userImage.naturalHeight;

    const boxW = container.clientWidth;
    const boxH = container.clientHeight;

    const scaleCover = Math.max(boxW / imgW, boxH / imgH);

    const baseW = imgW * scaleCover;
    const baseH = imgH * scaleCover;

    let baseX = (boxW - baseW) / 2;
    let baseY = (boxH - baseH) / 2;

    const finalW = baseW * scale;
    const finalH = baseH * scale;

    const finalX = (baseX * scale + posX);
    const finalY = (baseY * scale + posY);

    const scaleX = canvas.width / boxW;
    const scaleY = canvas.height / boxH;

    ctx.drawImage(
        userImage,
        finalX * scaleX,
        finalY * scaleY,
        finalW * scaleX,
        finalH * scaleY
    );

    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "framed.png";
        link.click();
    }, "image/png");
}
</script>

</body>
</html>
