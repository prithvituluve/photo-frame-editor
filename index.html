<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Frame Editor</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #111;
    color: white;
}
#userImage {
    transform-origin: top left;
}
.container {
    position: relative;
    width: 90%;
    max-width: 600px;
    aspect-ratio: 5/4;
    margin: 20px auto;
    overflow: hidden;
    border: 2px solid #444;
    background: black;
    touch-action: none; /* IMPORTANT */
}

/* USER IMAGE */
#userImage {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    cursor: grab;
}

/* FRAME */
#frame {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    z-index: 2;
    pointer-events: none;
}

input[type="range"] {
    width: 80%;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Photo Frame Editor</h2>

<input type="file" id="upload" accept="image/*">

<div class="container" id="container">
    <img id="userImage">
    <img id="frame" src="KFCFrame2.png">
</div>

<br>

Zoom:
<input type="range" id="zoom" min="0.2" max="3" step="0.01" value="1">

<br><br>

Horizontal Move:
<input type="range" id="moveX" min="-1000" max="1000" value="0">

<br><br>

Vertical Move:
<input type="range" id="moveY" min="-1000" max="1000" value="0">

<br><br>

<button onclick="downloadImage()">Download</button>

<canvas id="canvas" width="3000" height="2400" style="display:none;"></canvas>

<script>
async function downloadImage() {
    if (!userImage.src) {
        alert("Upload image first!");
        return;
    }

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const container = document.getElementById("container");

    await waitForImage(userImage);
    await waitForImage(frame);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const imgW = userImage.naturalWidth;
    const imgH = userImage.naturalHeight;

    const boxW = container.clientWidth;
    const boxH = container.clientHeight;

    // 🔥 simulate object-fit: cover
    const scaleCover = Math.max(boxW / imgW, boxH / imgH);

    const baseW = imgW * scaleCover;
    const baseH = imgH * scaleCover;

    // center like CSS cover
    let baseX = (boxW - baseW) / 2;
    let baseY = (boxH - baseH) / 2;

    // apply user zoom
    const finalW = baseW * scale;
    const finalH = baseH * scale;

    // apply position (drag)
    const finalX = (baseX * scale + posX);
    const finalY = (baseY * scale + posY);

    // convert to canvas scale
    const scaleX = canvas.width / boxW;
    const scaleY = canvas.height / boxH;

    ctx.drawImage(
        userImage,
        finalX * scaleX,
        finalY * scaleY,
        finalW * scaleX,
        finalH * scaleY
    );

    // draw frame
    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

    // download
    canvas.toBlob((blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "framed.png";
        link.click();
    }, "image/png");
}
</script>

</body>
</html>
